<html lang="en">
    <head>
        <meta charset="UTF-8">

    <body>
        <form action="https://httpbin.io/dump/request" method="POST">
            <fieldset>
                <label for="name">Enter name:</label>
                <input type="text",id="name",name="name">
                <p></p>
                <label for="em">Enter email address:</label>
                <input type="email",id="em",name="email">
                <p></p>
                <label for="date">Enter date of birth:</label>
                <input type="date",id="date",name="date">
                <p></p>
                <label for="color">Enter favourite colour:</label>
                <input type="color",id="color",name="color">
                <p></p>
            
                <label for="color">Select which applies:</label>
                <ul>
                    <li>
                        <label for="staff">Staff</label>
                        <input type="radio" id="staff" name="select" value="staff">
                    </li>
                    <li>
                        <label for="student">Student</label>
                        <input type="radio" id="student" name="select" value="student">
                    </li>
                </ul>
            
            </fieldset>
            <input type="submit">
        </form>
    </body>
